[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wetlab"
version = "0.1.0"
description = "Hands-free protocol reader for a bench scientist, built on LiveKit and Rime"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents==1.8.0",
    "livekit==1.1.17",
    "livekit-api==1.2.1",
    "livekit-plugins-rime==1.8.0",
    "livekit-plugins-silero==1.8.0",
    "livekit-plugins-openai==1.8.0",
    # Turn detection has been in use since the first live run and was never
    # declared, so a fresh install ran without it and fell back to voice
    # activity alone.
    "livekit-plugins-turn-detector==1.8.0",
    "aiohttp>=3.13",
    "pyyaml>=6",
    "python-dotenv>=1",
    # Pure Python, no dependencies of its own. Backs the step index.
    "rank-bm25==0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "PyJWT>=2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: needs a network and a provider key; skipped unless the env vars are set",
    "slow: minutes rather than seconds; the round trip synthesises the whole corpus twice",
]
