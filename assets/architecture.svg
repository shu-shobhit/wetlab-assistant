<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1232 790" width="1232" height="790" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#141413">
  <title>Wetlab Assistant: architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#141413"/>
    </marker>
    <marker id="arrow-clay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b5602f"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #141413; stroke-width: 1.2; }
      .band { fill: #f4f2ee; stroke: none; }
      .hosted { fill: #fbf1ea; stroke: #b5602f; stroke-width: 1.2; }
      .title { font-size: 14px; font-weight: 600; }
      .band-title { font-size: 15px; font-weight: 600; }
      .note { font-size: 12px; fill: #4a4844; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .flow { stroke: #141413; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
      .flow2 { stroke: #141413; stroke-width: 1.2; fill: none; marker-end: url(#arrow); marker-start: url(#arrow); }
      .data { stroke: #141413; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); marker-start: url(#arrow); }
      .call { stroke: #b5602f; stroke-width: 1.2; fill: none; marker-end: url(#arrow-clay); marker-start: url(#arrow-clay); }
    </style>
  </defs>

  <rect width="1232" height="790" fill="#ffffff"/>

  <!-- Band 1: offline preparation -->
  <rect class="band" x="20" y="20" width="1192" height="190" rx="6"/>
  <text class="band-title" x="36" y="46">Before a session: a protocol is ingested and prepared once, then committed</text>

  <rect class="box" x="40" y="70" width="160" height="96" rx="4"/>
  <text class="title" x="52" y="92">Protocol source</text>
  <text class="mono" x="52" y="112">source.md</text>
  <text class="note" x="52" y="131">Fetched text and a</text>
  <text class="note" x="52" y="147">citation with the date</text>

  <path class="flow" d="M 200 118 L 236 118"/>

  <rect class="box" x="238" y="70" width="200" height="96" rx="4"/>
  <text class="mono" x="250" y="92">scripts/ingest_protocol.py</text>
  <text class="note" x="250" y="112">Model: z-ai/glm-5.3</text>
  <text class="note" x="250" y="131">One action per step, every value</text>
  <text class="note" x="250" y="147">verbatim, waits become timers</text>

  <path class="flow" d="M 438 118 L 474 118"/>

  <rect class="box" x="476" y="70" width="150" height="96" rx="4"/>
  <text class="title" x="488" y="92">Ordered steps</text>
  <text class="mono" x="488" y="112">parsed.yaml</text>
  <text class="note" x="488" y="131">Step text and</text>
  <text class="note" x="488" y="147">declared timers</text>

  <path class="flow" d="M 626 118 L 662 118"/>

  <rect class="box" x="664" y="70" width="220" height="96" rx="4"/>
  <text class="mono" x="676" y="92">scripts/prepare_protocol.py</text>
  <text class="note" x="676" y="112">z-ai/glm-5.3-flash writes the spoken</text>
  <text class="note" x="676" y="128">form; openai/gpt-5-mini checks that</text>
  <text class="note" x="676" y="144">no value changed; a step that fails</text>
  <text class="note" x="676" y="160">the check is not written</text>

  <path class="flow" d="M 884 118 L 920 118"/>

  <rect class="box" x="922" y="70" width="160" height="96" rx="4"/>
  <text class="title" x="934" y="92">Spoken form</text>
  <text class="mono" x="934" y="112">spoken.yaml</text>
  <text class="note" x="934" y="131">Speech text and</text>
  <text class="note" x="934" y="147">retrieval terms per step</text>

  <!-- spoken.yaml is loaded by the worker at startup -->
  <path class="flow" d="M 1002 166 L 1002 236 L 900 236 L 900 268"/>
  <text class="note" x="1010" y="200">Loaded at startup;</text>
  <text class="note" x="1010" y="216">unprepared protocols are refused</text>

  <!-- Band 2: session -->
  <text class="band-title" x="36" y="248">Session: four local processes on one laptop, three hosted services</text>

  <!-- aiohttp server -->
  <rect class="box" x="40" y="270" width="220" height="56" rx="4"/>
  <text class="mono" x="52" y="291">wetlab.webserver (aiohttp)</text>
  <text class="note" x="52" y="310">Serves the page, signs the join token</text>

  <path class="flow" d="M 150 326 L 150 356"/>
  <text class="note" x="158" y="345">page + token</text>

  <!-- Browser tab -->
  <rect class="box" x="40" y="358" width="220" height="392" rx="4"/>
  <text class="title" x="52" y="380">Browser tab</text>
  <text class="note" x="52" y="400">Microphone, speaker, screen.</text>
  <text class="note" x="52" y="416">Holds no product state.</text>
  <text class="note" x="52" y="446">Shows the source step and its</text>
  <text class="note" x="52" y="462">spoken form, timers, both sides</text>
  <text class="note" x="52" y="478">of each turn, the called tool</text>
  <text class="note" x="52" y="494">and the event stream.</text>
  <rect class="box" x="52" y="626" width="196" height="112" rx="4"/>
  <text class="title" x="62" y="646">Listener probe</text>
  <text class="mono" x="62" y="666">web/probe.js</text>
  <text class="note" x="62" y="684">Reads jitterBufferEmittedCount</text>
  <text class="note" x="62" y="700">from the WebRTC receiver: what</text>
  <text class="note" x="62" y="716">reached the speaker, not what</text>
  <text class="note" x="62" y="732">the agent pushed</text>

  <!-- livekit-server -->
  <rect class="box" x="320" y="358" width="170" height="392" rx="4"/>
  <text class="mono" x="332" y="380">livekit-server --dev</text>
  <text class="note" x="332" y="400">Routes audio and the</text>
  <text class="note" x="332" y="416">data channel on loopback.</text>
  <text class="note" x="332" y="446">Media never leaves</text>
  <text class="note" x="332" y="462">the machine.</text>

  <!-- browser <-> livekit-server -->
  <path class="flow" d="M 260 530 L 318 530"/>
  <text class="note" x="266" y="522">mic audio</text>
  <path class="flow" d="M 318 600 L 262 600"/>
  <text class="note" x="266" y="618">assistant audio</text>
  <path class="data" d="M 262 688 L 318 688"/>
  <text class="note" x="266" y="710">data</text>

  <!-- livekit-server <-> worker -->
  <path class="flow" d="M 490 530 L 538 530"/>
  <path class="flow" d="M 538 600 L 492 600"/>
  <path class="data" d="M 492 688 L 538 688"/>
  <text class="note" x="497" y="710">data</text>

  <!-- Agent worker -->
  <rect class="box" x="540" y="270" width="420" height="480" rx="4"/>
  <text class="title" x="552" y="292">Agent worker</text>
  <text class="mono" x="660" y="292">wetlab.agent</text>
  <text class="note" x="552" y="310">Holds every credential, the protocol, the pointer, the timers and the log.</text>

  <rect class="box" x="560" y="324" width="380" height="44" rx="3"/>
  <text x="570" y="342">Silero VAD, then streaming recognition</text>
  <text class="mono" x="570" y="359">deepgram/nova-3</text>

  <path class="flow" d="M 750 368 L 750 384"/>

  <rect class="box" x="560" y="386" width="380" height="44" rx="3"/>
  <text x="570" y="404">Turn detection and adaptive interruption</text>
  <text class="mono" x="570" y="421">turn-detector-v1, local v1-mini as fallback</text>

  <path class="flow" d="M 750 430 L 750 446"/>

  <rect class="box" x="560" y="448" width="380" height="60" rx="3"/>
  <text x="570" y="466">Conversation model with 11 tools, one call at a time</text>
  <text class="mono" x="570" y="483">deepseek/deepseek-v4-flash via OpenRouter</text>
  <text class="note" x="570" y="500">Context: position, last six spoken steps, table of contents</text>

  <path class="flow" d="M 750 508 L 750 524"/>

  <rect class="box" x="560" y="526" width="380" height="60" rx="3"/>
  <text x="570" y="544">Tools change state and return the text to say</text>
  <text class="mono" x="570" y="561">position.py  retrieval.py (BM25)  timers.py</text>
  <text class="note" x="570" y="578">Each call carries a status sentence spoken while the tool runs</text>

  <path class="flow" d="M 750 586 L 750 602"/>

  <rect class="box" x="560" y="604" width="380" height="44" rx="3"/>
  <text x="570" y="622">Markup in tts_node: acronyms wrapped in spell()</text>
  <text class="mono" x="570" y="639">markup.py, the model never sees markup</text>

  <path class="flow" d="M 750 648 L 750 664"/>

  <rect class="box" x="560" y="666" width="380" height="44" rx="3"/>
  <text x="570" y="684">Fenced Rime stream, one context id per utterance</text>
  <text class="mono" x="570" y="701">tts_rime.py: audio of a cut utterance is dropped</text>

  <rect class="box" x="560" y="716" width="380" height="26" rx="3"/>
  <text class="mono" x="570" y="734">events.py logs each stage of a turn to events.jsonl</text>

  <!-- Hosted services -->
  <rect class="hosted" x="1000" y="324" width="212" height="106" rx="4"/>
  <text class="title" x="1012" y="346">LiveKit inference gateway</text>
  <text class="note" x="1012" y="366">Hosted. Receives microphone</text>
  <text class="note" x="1012" y="382">audio for recognition and</text>
  <text class="note" x="1012" y="398">turn detection.</text>
  <text class="mono" x="1012" y="418">agent-gateway.livekit.cloud</text>

  <rect class="hosted" x="1000" y="448" width="212" height="76" rx="4"/>
  <text class="title" x="1012" y="470">OpenRouter</text>
  <text class="note" x="1012" y="488">Hosted. Receives text, not audio.</text>
  <text class="note" x="1012" y="504">Provider pinned:</text>
  <text class="mono" x="1012" y="518">baidu/fp8, alibaba/fp8</text>

  <rect class="hosted" x="1000" y="604" width="212" height="120" rx="4"/>
  <text class="title" x="1012" y="626">Rime</text>
  <text class="note" x="1012" y="646">Hosted. Produces all speech.</text>
  <text class="mono" x="1012" y="664">mistv3, speaker luna, eng</text>
  <text class="mono" x="1012" y="680">wss://users-ws.rime.ai/ws3</text>
  <text class="mono" x="1012" y="696">PCM 22050 Hz mono</text>
  <text class="mono" x="1012" y="712">segment=never</text>

  <path class="call" d="M 942 346 L 998 346"/>
  <path class="call" d="M 942 408 L 998 408"/>
  <path class="call" d="M 942 478 L 998 478"/>
  <path class="call" d="M 942 688 L 998 688"/>

  <!-- Legend -->
  <rect class="box" x="20" y="762" width="14" height="14"/>
  <text class="note" x="40" y="774">Local process</text>
  <rect class="hosted" x="140" y="762" width="14" height="14"/>
  <text class="note" x="160" y="774">Hosted service, called over the network</text>
  <path class="flow" d="M 400 769 L 440 769"/>
  <text class="note" x="448" y="774">Audio or files</text>
  <path class="data" d="M 550 769 L 590 769"/>
  <text class="note" x="598" y="774">Data channel: transcripts, events, probe reports</text>
  <path class="call" d="M 900 769 L 940 769"/>
  <text class="note" x="948" y="774">API call</text>
</svg>
